name: Build Succeeds on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build the Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install

      - name: Run Build
        run: npm run build
